spring.application.name=hy-all

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=develop
spring.datasource.password=develop

# JWT
jwt.secret=this_is_a_jwt_secret

spring.jackson.mapper.accept-case-insensitive-properties=true
spring.docker.compose.enabled=true
spring.docker.compose.file=docker-compose.yaml
